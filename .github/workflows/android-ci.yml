name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runner image already ships the Android SDK. Avoid a
      # third-party setup action so a flaky download cannot block the build.
      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME" || ls /usr/local/lib/android/sdk
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile (Kotlin + resources)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace 2>&1 | tee build-compile.log

      - name: Unit tests (JVM + Robolectric)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee build-test.log

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --stacktrace 2>&1 | tee build-lint.log

      - name: Surface lint errors
        if: always()
        shell: bash
        run: |
          set +e
          for f in app/build/reports/lint-results-debug.txt app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; do
            if [ -f "$f" ]; then
              echo "== $f =="
              grep -E "Error:" "$f" | head -n 60 | while IFS= read -r line; do
                printf '::error file=lint::%s\n' "${line:0:900}"
              done
            fi
          done
          exit 0

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-assemble.log

      - name: Publish build logs as annotations
        if: always()
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          total=0
          for f in build-*.log; do
            while IFS= read -r line; do
              printf '::error file=%s::%s\n' "$f" "${line:0:900}"
              total=$((total + 1))
            done < <(grep -E "^e: |error:|FAILURE:|Execution failed|Caused by:|^> Task .*FAILED" "$f" | head -n 60)
          done
          echo "Published $total diagnostic lines."
          exit 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore

      - name: Verify APK
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK=$APK"
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 12
          sha256sum "$APK" | tee debug-apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hisaabos-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            debug-apk.sha256
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
            app/build/test-results/**
          if-no-files-found: ignore

  instrumented:
    name: Instrumented UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
