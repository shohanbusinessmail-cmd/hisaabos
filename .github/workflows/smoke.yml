name: smoke
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: env
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          curl -sS -o /dev/null -w 'google-maven:%{http_code}\n' https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/1.13.1/core-ktx-1.13.1.pom
          curl -sS -o /dev/null -w 'gradle-dist:%{http_code}\n' https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
